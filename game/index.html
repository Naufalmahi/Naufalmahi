<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naufal's Contribution Game</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3}.wrap{width:min(92vw,720px);text-align:center}h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}p{color:#8b949e}.hud{display:flex;justify-content:space-between;gap:12px;margin:18px 0;font-weight:700}.board{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;background:#161b22;padding:8px;border:1px solid #30363d;border-radius:12px}.cell{aspect-ratio:1;border-radius:3px;background:#21262d}.snake{background:#58a6ff}.head{background:#79c0ff}.food{background:#3fb950;box-shadow:0 0 12px #3fb950}.controls{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}button{border:1px solid #30363d;background:#21262d;color:#e6edf3;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}button:hover{border-color:#58a6ff}.hint{font-size:13px}a{color:#58a6ff}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🎮 Contribution Game</h1>
    <p>Collect green commits. Grow your streak. Don't hit yourself.</p>
    <div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
    <div id="board" class="board" aria-label="Snake game board"></div>
    <div class="controls"><button id="start">Start / Restart</button><button id="up">↑</button><button id="left">←</button><button id="down">↓</button><button id="right">→</button></div>
    <p class="hint">Use Arrow Keys or WASD · <a href="https://github.com/Naufalmahi">Back to GitHub</a></p>
  </main>
<script>
const W=20,H=16,board=document.getElementById('board');let cells=[];let snake,dir,next,food,score,timer,playing=false;let best=Number(localStorage.getItem('naufal-game-best')||0);document.getElementById('best').textContent=best;
for(let i=0;i<W*H;i++){const c=document.createElement('div');c.className='cell';board.appendChild(c);cells.push(c)}
function placeFood(){do{food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function render(){cells.forEach(c=>c.className='cell');cells.forEach((s,i)=>{const c=cells[s.y*W+s.x];c.classList.add(i?'snake':'head')});cells[food.y*W+food.x].classList.add('food');document.getElementById('score').textContent=score}
function start(){clearInterval(timer);snake=[{x:5,y:8},{x:4,y:8},{x:3,y:8}];dir={x:1,y:0};next={...dir};score=0;playing=true;placeFood();render();timer=setInterval(tick,110)}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)){playing=false;clearInterval(timer);if(score>best){best=score;localStorage.setItem('naufal-game-best',best);document.getElementById('best').textContent=best}return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;placeFood()}else snake.pop();render()}
function setDir(x,y){if(!playing)return;if(x!==-dir.x||y!==-dir.y)next={x,y}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')setDir(0,-1);if(k==='arrowdown'||k==='s')setDir(0,1);if(k==='arrowleft'||k==='a')setDir(-1,0);if(k==='arrowright'||k==='d')setDir(1,0);if(k===' ')start()});document.getElementById('start').onclick=start;document.getElementById('up').onclick=()=>setDir(0,-1);document.getElementById('down').onclick=()=>setDir(0,1);document.getElementById('left').onclick=()=>setDir(-1,0);document.getElementById('right').onclick=()=>setDir(1,0);start();
</script>
</body>
</html>
