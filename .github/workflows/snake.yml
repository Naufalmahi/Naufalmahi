name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            assets/github-contribution-snake.svg?palette=github-dark&color_snake=#9fe870&color_dots=#1f2d26,#2f4a37,#3c7a4f,#5e9d54,#9fe870

      - name: Blend snake into profile background
        run: |
          python3 - <<'EOF'
          p = 'assets/github-contribution-snake.svg'
          s = open(p, encoding='utf-8').read()
          i = s.index('>') + 1
          s = s[:i] + '<rect x="-16" y="-32" width="880" height="192" fill="#0a0e0c"/>' + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Commit refreshed snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: assets/github-contribution-snake.svg
          commit_message: "chore: refresh contribution snake"

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
